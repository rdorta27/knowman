<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marca de knowman</title>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="aliases.css">
<link rel="stylesheet" href="fonts.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: var(--color-background); color: var(--color-text); font: 16px/1.5 var(--type-body); }
  h1, h2 { font-family: var(--type-heading); font-weight: var(--type-weight-heading); letter-spacing: var(--type-tracking-heading); margin: 0 0 12px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
  button { font: inherit; }
  .toggle { padding: 8px 16px; background: transparent; color: var(--color-text); border: 1px solid var(--color-border-strong); border-radius: var(--shape-radius); cursor: pointer; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 32px; }
  .swatch { border: 1px solid var(--color-border); border-radius: var(--shape-radius); overflow: hidden; background: var(--color-surface); font-size: 13px; }
  .swatch i { display: block; height: 56px; }
  .swatch span { display: block; padding: 8px; }
  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-top: var(--shape-rule) solid var(--color-primary); border-radius: var(--shape-radius); padding: 20px; max-width: 520px; margin-bottom: 24px; }
  .btn { display: inline-block; padding: 12px 22px; background: var(--color-action); color: var(--color-on-action); border: 0; border-radius: var(--shape-radius); font-weight: 700; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: var(--shape-radius); font-size: 12px; font-weight: 700; text-transform: uppercase; }
  .ok { background: var(--color-success-surface); color: var(--color-success); }
  .warn { background: var(--color-warning-surface); color: var(--color-warning); }
  .bad { background: var(--color-danger-surface); color: var(--color-danger); }
  code { font-family: var(--type-mono); }
</style>
</head>
<body>
<div class="bar">
  <h1>Marca de knowman</h1>
  <button class="toggle" id="toggle" type="button">Claro / oscuro</button>
</div>
<h2>Colores</h2>
<div class="swatches" id="swatches"></div>
<h2>Piezas</h2>
<div class="card">
  <h2>Una tarjeta recta</h2>
  <p>Filo azul arriba, borde fino y esquinas de <code>var(--shape-radius)</code>.</p>
  <p><span class="tag ok">Real</span> <span class="tag warn">Opcional</span> <span class="tag bad">Error</span></p>
  <a class="btn" href="#">Llamada principal</a>
</div>
<script>
  var names = ["background", "surface", "surface-alt", "text", "muted", "border", "border-strong", "primary", "accent", "action", "success", "warning", "danger"];
  var root = document.documentElement;
  var box = document.getElementById("swatches");
  names.forEach(function (name) {
    var cell = document.createElement("div");
    cell.className = "swatch";
    cell.innerHTML = '<i style="background:var(--color-' + name + ')"></i><span>' + name + "</span>";
    box.appendChild(cell);
  });
  document.getElementById("toggle").addEventListener("click", function () {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  });
</script>
</body>
</html>
