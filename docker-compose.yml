services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: knowman
      POSTGRES_PASSWORD: knowman
      POSTGRES_DB: knowman
    ports:
      - "5432:5432"
    volumes:
      - knowman-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowman"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  knowman-db:
