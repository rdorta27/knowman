services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: knowman
      POSTGRES_PASSWORD: knowman
      POSTGRES_DB: knowman
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - knowman-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowman"]
      interval: 2s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - knowman-ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://knowman:knowman@db:5432/knowman
      OLLAMA_URL: http://ollama:11434
      CORPUS_PATH: /corpus
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3.5:0.8b}
      AGENT_MODEL: ${AGENT_MODEL:-qwen3.5:2b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4}
    ports:
      - "8000:8000"
    volumes:
      - ./corpus/dummy:/corpus
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

  worker:
    build: .
    command: ["knowman", "worker"]
    environment:
      DATABASE_URL: postgresql://knowman:knowman@db:5432/knowman
      OLLAMA_URL: http://ollama:11434
      CORPUS_PATH: /corpus
    volumes:
      - ./corpus/dummy:/corpus:ro
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

  watcher:
    build: .
    command: ["knowman", "watch", "--path", "/corpus"]
    environment:
      DATABASE_URL: postgresql://knowman:knowman@db:5432/knowman
      CORPUS_PATH: /corpus
    volumes:
      - ./corpus/dummy:/corpus:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  knowman-db:
  knowman-ollama:
