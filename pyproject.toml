[project]
name = "knowman"
version = "0.1.0"
description = "Personal Markdown knowledge index with verifiable citations."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "watchfiles>=0.24",
]

[project.scripts]
knowman = "knowman.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowman"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "black>=24.10",
    "httpx2>=2.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
